# Plain Concepts quality gates — generated by `squad optimize gates` (Squad Optimized).
# Practices: Secrets (TruffleHog), Vulnerabilities (Trivy), SAST (Semgrep), SBOM (Syft),
# Tests & coverage floor (quality.config.json). Make every job a REQUIRED status check
# in a repository ruleset — gates are never advisory. Floors only ratchet up.
name: pc-quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pc-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog (verified secrets fail the build)
        run: docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest git file:///repo --only-verified --fail --no-update

  vulnerabilities:
    name: Vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (CRITICAL/HIGH)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /repo

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:latest semgrep scan --config p/default --error --metrics off /src

  sbom:
    name: SBOM (Syft CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        run: docker run --rm -v "$PWD:/repo" anchore/syft:latest dir:/repo -o cyclonedx-json > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-excellence-sbom
          path: sbom.cdx.json

  tests:
    name: Tests & coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      - name: Enforce coverage floor (quality.config.json)
        run: node .github/scripts/pc-coverage-floor.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engineering-excellence-coverage
          path: |
            coverage/
            **/coverage.cobertura.xml
          if-no-files-found: ignore
