# Plain Concepts PR guardrails — generated by `squad optimize gates` (Squad Optimized).
#  - spec-gate:  app-code changes must touch a spec, OpenSpec change or decision record,
#                and the PR must update docs or carry a "Docs-impact: none - <reason>" line.
#  - diff-check: rejects comment-heavy diffs, oversized test diffs, skipped/focused tests,
#                assertion-less tests and snapshot/mock-only tests.
#  - aidlc:      fails when the committed AIDLC level (.squad/aidlc/assessment.json) drops.
name: pc-pr-guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  spec-gate:
    name: Spec & docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Spec / decision record / docs-impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/pc-spec-gate.mjs

  diff-check:
    name: Diff quality check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Comments, slop and test quality
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pc-diff-check.mjs

  aidlc:
    name: AIDLC does not regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare AIDLC level with base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/pc-aidlc-trend.mjs >> "$GITHUB_STEP_SUMMARY"
