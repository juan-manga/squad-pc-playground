# Squad delivery metrics — generated by `squad optimize metrics` (Squad Optimized).
# Weekly (and on demand) computes metrics over PRs labelled `squad`: throughput, merge
# rate, lead time, time to first review, merged-by-the-gate share, AI share of merged
# PRs, per agent / role / model / week. Publishes to the job summary and as an artifact.
name: pc-metrics

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Window: 30d, 90d or YYYY-MM-DD'
        default: '30d'

permissions:
  contents: read
  pull-requests: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Compute metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since || '30d' }}
        run: node .github/scripts/pc-metrics.mjs --since "$SINCE" --out squad-metrics >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squad-metrics
          path: squad-metrics/
