# Plain Concepts L3 practices — generated by `squad optimize gates` (Squad Optimized).
#  - Mutation (Stryker): threshold on covered-code score (quality.config.json → mutation.break)
#  - Complexity: cyclomatic complexity ≤ 15 per function (lizard), against a baseline
#  - DAST: OWASP ZAP passive baseline against vars.DAST_TARGET_URL (skipped when unset)
# Runs weekly and on demand; failures open the conversation, they do not block PRs.
name: pc-weekly-quality

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{SETUP_STEPS}}
      - name: Install
        run: {{INSTALL_COMMAND}}
      - name: Stryker
        run: {{MUTATION_COMMAND}}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-excellence-mutation
          path: |
            reports/mutation/
            **/StrykerOutput/**/reports/
          if-no-files-found: ignore

  complexity:
    name: Complexity (CC ≤ 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: lizard
        run: |
          pip install lizard
          lizard {{CODE_DIRS}} --CCN 15 --length 200 --warnings_only -x "*/node_modules/*" -x "*/bin/*" -x "*/obj/*" -x "*/dist/*" -x "*test*"

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    if: vars.DAST_TARGET_URL != ''
    steps:
      - name: ZAP passive baseline
        env:
          TARGET: ${{ vars.DAST_TARGET_URL }}
        run: docker run --rm -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$TARGET" -I
