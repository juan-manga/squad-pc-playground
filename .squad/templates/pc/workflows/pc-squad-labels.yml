# Label every PR produced by the Squad agent team — generated by `squad optimize metrics`.
# A PR is a Squad PR when its branch starts with `squad/`, its author is a bot/agent
# (quality.config.json → mergeGate.botAuthors) or its body has a `Squad-Agent:` trailer.
# Labels: squad, squad:agent:<name>, squad:role:<role>, squad:model:<model>.
# Uses pull_request_target with the BASE branch checkout only: PR code is never executed.
name: pc-squad-labels

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide labels
        id: decide
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/pc-squad-labels.mjs >> "$GITHUB_OUTPUT"
      - name: Apply labels
        if: steps.decide.outputs.labels != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ steps.decide.outputs.labels }}
        run: |
          IFS=',' read -ra list <<< "$LABELS"
          for l in "${list[@]}"; do
            gh label create "$l" --color 5319e7 --description "Squad agent team" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "$l"
          done
