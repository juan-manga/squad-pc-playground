# Plain Concepts merge gate — generated by `squad optimize gates` (Squad Optimized).
# Bot / agent PRs merge with no human when every required check is green and the
# change is outside the human checkpoints (.github/, secrets, >10k lines,
# migrations/irreversible changes, low-confidence label). Otherwise the PR is
# labelled `human-review`. Requires "Allow auto-merge" in the repository settings.
name: pc-merge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify risk
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/pc-merge-gate.mjs >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge (gate decides, required checks still apply)
        if: steps.risk.outputs.disposition == 'auto-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create squad:auto-merged --color 0e8a16 --description "Merged by the merge gate with no human review" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label squad:auto-merged
          gh pr merge "$PR_NUMBER" --auto --squash
      - name: Request human review
        if: steps.risk.outputs.disposition == 'human-review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.risk.outputs.reason }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label human-review || true
          gh pr comment "$PR_NUMBER" --body "Merge gate: human review required — $REASON"
